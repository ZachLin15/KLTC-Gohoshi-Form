# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Both services here run on Render's free tier — $0/month. Data lives in a
# free Turso database (see README > "Deploying to Render" for how to create
# one), not on Render's own disk, since free Render services don't get a
# persistent disk.
#
# In the Render dashboard: New > Blueprint > connect this repo. Render reads
# this file and proposes both services below. You'll be prompted for three
# secrets first (ADMIN_PASSWORD, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN);
# SESSION_SECRET is generated for you automatically.
#
# `fromService ... property: host` only gives the bare subdomain (e.g.
# "kltc-signup-api"), not the full URL. Rather than trying to build the full
# URL via shell string interpolation in a start/build command (Render's
# dockerCommand doesn't reliably support that), each service reads the bare
# host from a plain env var and builds the full URL itself: the API in
# src/index.js (CLIENT_HOST -> CLIENT_ORIGIN), the client in
# scripts/prepare-env.js (API_HOST -> VITE_API_URL, written to
# .env.production before `vite build` runs).

services:
  - type: web
    name: kltc-signup-api
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_HOST
        fromService:
          type: web
          name: kltc-signup-client
          property: host

  - type: web
    name: kltc-signup-client
    runtime: static
    rootDir: ./client
    buildCommand: npm install && node scripts/prepare-env.cjs && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: kltc-signup-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # hashed filenames (index-abc123.js) are safe to cache forever — a new
      # deploy produces a new filename, so there's no staleness risk
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must always be revalidated, or browsers could keep
      # pointing at yesterday's (deleted) hashed asset filenames
      - path: /index.html
        name: Cache-Control
        value: no-cache


