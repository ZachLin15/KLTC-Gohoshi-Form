# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Both services here run on Render's free tier — $0/month. Data lives in a
# free Turso database (see README > "Deploying to Render" for how to create
# one), not on Render's own disk, since free Render services don't get a
# persistent disk.
#
# In the Render dashboard: New > Blueprint > connect this repo. Render reads
# this file and proposes both services below. You'll be prompted for three
# secrets first (ADMIN_PASSWORD, TURSO_DATABASE_URL, TURSO_AUTH_TOKEN);
# SESSION_SECRET is generated for you automatically.
#
# `fromService ... property: host` only gives the bare subdomain (e.g.
# "kltc-signup-api"), not the full URL. Rather than trying to build the full
# URL via shell string interpolation in a start/build command (Render's
# dockerCommand doesn't reliably support that), the API service reads the
# bare host from a plain env var and builds the full URL itself
# (src/index.js: CLIENT_HOST -> CLIENT_ORIGIN).
#
# The client calls the API cross-origin, directly at its own .onrender.com
# URL (see client/src/lib/api.js) — plain CORS, no cookies involved. Admin
# auth is a bearer token in a request header rather than a cookie, on
# purpose: the client and API are on two different onrender.com subdomains,
# which Safari/iOS treats as different *sites* and blocks cookies between by
# default (Intelligent Tracking Prevention), which is what made admin login
# unreliable on iPhone. A token in a header has no such restriction in any
# browser, so there's no need for same-origin proxying to work around it.

services:
  - type: web
    name: kltc-signup-api
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_HOST
        fromService:
          type: web
          name: kltc-signup-client
          property: host

  - type: web
    name: kltc-signup-client
    runtime: static
    rootDir: ./client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # hashed filenames (index-abc123.js) are safe to cache forever — a new
      # deploy produces a new filename, so there's no staleness risk
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must always be revalidated, or browsers could keep
      # pointing at yesterday's (deleted) hashed asset filenames
      - path: /index.html
        name: Cache-Control
        value: no-cache


